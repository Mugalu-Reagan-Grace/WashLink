services:
  - type: web
    name: washlink-payment-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix api
    startCommand: npm start --prefix api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PESAPAL_ENVIRONMENT
        value: sandbox
      - key: PUBLIC_WEB_ORIGIN
        value: http://192.168.100.250:5173
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
